name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to S3 and CloudFront
    # Skipped (not failed) until the repository variables from infra/README.md exist.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_S3_BUCKET != '' &&
      vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Hashed assets go first and are never deleted, so tabs still running the
      # previous index.html can keep loading their chunks.
      - name: Upload hashed assets
        run: >-
          aws s3 sync dist/assets "s3://$AWS_S3_BUCKET/assets"
          --cache-control "public, max-age=31536000, immutable"

      - name: Upload other files
        run: >-
          aws s3 sync dist "s3://$AWS_S3_BUCKET"
          --exclude "assets/*" --exclude "index.html"
          --cache-control "public, max-age=300"
          --delete

      # index.html goes last so it only references assets that already exist.
      - name: Upload index.html
        run: >-
          aws s3 cp dist/index.html "s3://$AWS_S3_BUCKET/index.html"
          --cache-control "no-cache"
          --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
